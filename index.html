<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>名刺</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }

    .card-row {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    /* ── nav buttons ── */
    .nav-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      font-size: 28px;
      font-weight: 300;
      color: #000;
      line-height: 1;
      transition: opacity 0.12s;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      user-select: none;
      width: 28px;
      text-align: center;
    }
    .nav-btn:hover { opacity: 0.35; }
    .nav-btn:disabled { opacity: 0.15; cursor: default; pointer-events: none; }

    /* ── card scene: actual Japanese meishi 91×55mm +20% ── */
    .scene {
      width: 114.7mm;
      height: 69.3mm;
      perspective: 756mm;
      flex-shrink: 0;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.75s cubic-bezier(0.4, 0.15, 0.2, 1);
      cursor: pointer;
    }
    .card-inner.flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 3px;
      overflow: hidden;
      box-shadow: none;
      border: 1px solid #000;
    }
    .card-face img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card-back { transform: rotateY(180deg); }

    /* ── counter ── */
    .counter {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 13px;
      letter-spacing: 0.06em;
      color: #000;
    }
  </style>
</head>
<body>

  <div class="card-row">
    <button class="nav-btn" id="prevBtn" disabled>&lt;</button>

    <div class="scene">
      <div class="card-inner" id="cardInner">
        <div class="card-face card-front">
          <img id="frontImg" src="" alt="">
        </div>
        <div class="card-face card-back">
          <img id="backImg" src="" alt="">
        </div>
      </div>
    </div>

    <button class="nav-btn" id="nextBtn">&gt;</button>
  </div>

  <span class="counter" id="counter">1/12</span>

  <script>
    const BASE = 'images/';

    const cards = Array.from({length: 12}, (_, i) => ({
      front: `card${i + 1}.png`,
      back:  `back${i + 1}.png`,
    }));

    let current = 0;
    let isFlipped = false;

    const frontImg  = document.getElementById('frontImg');
    const backImg   = document.getElementById('backImg');
    const cardInner = document.getElementById('cardInner');
    const counter   = document.getElementById('counter');
    const prevBtn   = document.getElementById('prevBtn');
    const nextBtn   = document.getElementById('nextBtn');

    function setCard(index) {
      current = index;
      frontImg.src = BASE + cards[current].front;
      backImg.src  = BASE + cards[current].back;
      counter.textContent = (current + 1) + '/' + cards.length;
      prevBtn.disabled = current === 0;
      nextBtn.disabled = current === cards.length - 1;
    }

    function navigate(index) {
      if (isFlipped) {
        cardInner.classList.remove('flipped');
        isFlipped = false;
        setTimeout(() => setCard(index), 380);
      } else {
        setCard(index);
      }
    }

    cardInner.addEventListener('click', () => {
      isFlipped = !isFlipped;
      cardInner.classList.toggle('flipped', isFlipped);
    });

    prevBtn.addEventListener('click', () => { if (current > 0) navigate(current - 1); });
    nextBtn.addEventListener('click', () => { if (current < cards.length - 1) navigate(current + 1); });

    document.addEventListener('keydown', e => {
      if      (e.key === 'ArrowRight') { e.preventDefault(); if (current < cards.length - 1) navigate(current + 1); }
      else if (e.key === 'ArrowLeft')  { e.preventDefault(); if (current > 0) navigate(current - 1); }
      else if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        isFlipped = !isFlipped;
        cardInner.classList.toggle('flipped', isFlipped);
      }
    });

    setCard(0);
  </script>
</body>
</html>
